name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          # Dummy DATABASE_URL so the DB client initialises without error during
          # the Next.js build-time page-data collection step. No real connection
          # is made — route handlers that use the DB are marked force-dynamic.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
