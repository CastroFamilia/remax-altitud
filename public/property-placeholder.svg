<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Background with dark navy gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a30" />
      <stop offset="100%" stop-color="#050d18" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#bg-grad)" />
  
  <!-- Subtle geometric background overlay patterns -->
  <circle cx="300" cy="200" r="180" fill="none" stroke="url(#gold-grad)" stroke-width="1" opacity="0.15" />
  <circle cx="300" cy="200" r="140" fill="none" stroke="url(#gold-grad)" stroke-dasharray="5 5" stroke-width="1" opacity="0.1" />

  <!-- Luxury architectural icon -->
  <g transform="translate(250, 110)">
    <!-- House lines -->
    <path d="M 50,0 L 100,50 L 90,50 L 50,15 L 10,50 L 0,50 Z" fill="url(#gold-grad)" />
    <path d="M 15,55 L 15,100 L 85,100 L 85,55 L 50,25 Z" fill="none" stroke="url(#gold-grad)" stroke-width="2" />
    <line x1="50" y1="60" x2="50" y2="100" stroke="url(#gold-grad)" stroke-width="1.5" />
    <line x1="25" y1="75" x2="75" y2="75" stroke="url(#gold-grad)" stroke-width="1.5" />
  </g>
  
  <!-- RE/MAX ALTITUD Text -->
  <text x="300" y="270" text-anchor="middle" fill="url(#gold-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="4">RE/MAX ALTITUD</text>
  <text x="300" y="295" text-anchor="middle" fill="#8892b0" font-family="system-ui, -apple-system, sans-serif" font-size="12" letter-spacing="2" opacity="0.8">LUXURY PROPERTIES</text>
</svg>
