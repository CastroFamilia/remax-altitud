services:
  postgres:
    image: imresamu/postgis:16-3.4
    container_name: remax-altitud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remax}
      POSTGRES_DB: ${POSTGRES_DB:-remax_altitud}
    ports:
      # Host port is configurable via POSTGRES_PORT (defaults to 5432). Set
      # POSTGRES_PORT in .env when 5432 is already taken by another service.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - remax_altitud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remax} -d ${POSTGRES_DB:-remax_altitud}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  remax_altitud_postgres_data:
